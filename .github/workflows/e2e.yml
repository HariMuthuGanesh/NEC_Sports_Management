# ============================================================
#  NEC Sports Management — End-to-End (E2E) Playwright Tests
#  Automates multi-browser testing across Chromium, Firefox & WebKit
# ============================================================

name: 🎭 E2E — Playwright Automated Testing

on:
  workflow_dispatch:
  push:
    branches:
      - Frontend
      - Backend
  pull_request:
    branches:
      - Frontend
      - Backend

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: 🧪 Run Playwright E2E Test Suite
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🌐 Install Playwright Browsers & OS Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 🚀 Execute Playwright E2E Tests (Chromium)
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: 📊 Upload Playwright HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-report
          path: frontend/playwright-report/
          retention-days: 14
