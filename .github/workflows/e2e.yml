# ============================================================
#  NEC Sports Management — End-to-End (E2E) Playwright Tests
#  Automates multi-browser testing across Chromium, Firefox & WebKit
# ============================================================

name: 🎭 E2E — Playwright Automated Testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Frontend
      - Backend
  pull_request:
    branches:
      - main
      - Frontend
      - Backend

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: 🧪 Run Playwright E2E Test Suite
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🛢️ Start MySQL Service
        run: |
          docker run --name mysql-test -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=SportsDB -p 3306:3306 -d mysql:8
          echo "Waiting for MySQL to start..."
          until docker exec mysql-test mysqladmin ping -h 127.0.0.1 --silent; do
            sleep 2
          done

      - name: 📦 Install Backend Dependencies & Seed DB
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: SportsDB
          JWT_SECRET: testing_secret
          COOKIE_SECRET: testing_cookie_secret
          CSRF_SECRET: testing_csrf_secret
        run: |
          npm ci
          # backend/src/data/seed.sql was never committed (it is intentionally
          # gitignored — see .gitignore's "Database, Local Data & Uploads"
          # section). The real seeding mechanism is the `seed` npm script,
          # which creates all tables itself (see seedData.js::ensureTables)
          # and inserts demo users/departments/teams/matches with properly
          # bcrypt-hashed passwords, so schema.sql does not need to be piped
          # in separately beforehand.
          npm run seed

      - name: 🚀 Start Backend Server
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: SportsDB
          # `npm start` runs with NODE_ENV=production (see package.json), and
          # backend/src/config/securityConfig.js exits the process immediately
          # if JWT_SECRET, COOKIE_SECRET, or CSRF_SECRET are unset in
          # production — all three must be provided here or the server never
          # comes up and the wait-on step below times out.
          JWT_SECRET: testing_secret
          COOKIE_SECRET: testing_cookie_secret
          CSRF_SECRET: testing_csrf_secret
        run: |
          npm start &
          npx wait-on http://127.0.0.1:5000/api/sports

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🌐 Install Playwright Browsers & OS Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 🚀 Execute Playwright E2E Tests (Chromium)
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: 📊 Upload Playwright HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-report
          path: frontend/playwright-report/
          retention-days: 14
